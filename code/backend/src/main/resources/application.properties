spring.application.name=supermarket
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supermarket}
spring.datasource.username=${DB_USER:supermarket}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=supermarket
app.jwt.lifetime-seconds=900
server.error.include-message=never
server.error.include-stacktrace=never
