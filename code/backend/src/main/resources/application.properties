spring.application.name=supermarket
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supermarket}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=supermarket
app.jwt.lifetime-seconds=900
app.payment.bank-id=${VIETQR_BANK_ID:}
app.payment.account-no=${VIETQR_ACCOUNT_NO:}
app.payment.account-name=${VIETQR_ACCOUNT_NAME:}
app.demo.enabled=${APP_DEMO_ENABLED:false}
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.accept-float-as-int=false
