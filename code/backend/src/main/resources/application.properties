spring.application.name=supermarket
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supermarket}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.jwt.issuer=supermarket
app.jwt.lifetime-seconds=900
app.payment.bank-id=${VIETQR_BANK_ID:MB}
app.payment.account-no=${VIETQR_ACCOUNT_NO:0123456789}
app.payment.account-name=${VIETQR_ACCOUNT_NAME:SIEU THI SUPERMARKET}
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
