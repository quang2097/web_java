services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: supermarket
      POSTGRES_USER: supermarket
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermarket -d supermarket"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
